[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "gnomon-render"
version = "1.0.0"
description = "CPU triangle still-image rendering service"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "Pillow==12.0.0", "fastapi==0.121.3", "uvicorn==0.38.0", "pydantic==2.14.3"]
[project.optional-dependencies]
examples = ["httpx==0.28.1"]
[tool.setuptools.packages.find]
include = ["gnomon*"]
